name: Dependency audit

# Weekly check of the production dependency tree against the advisory DB,
# independent of Dependabot (catches advisories in transitive packages that
# only an override can fix).
on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Production dependencies (fails on high/critical)
        run: pnpm audit --prod --audit-level=high
