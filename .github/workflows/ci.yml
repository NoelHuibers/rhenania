name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI never gets production credentials: every database is a local libSQL
# file, created and migrated inside the job.
env:
  NEXT_TELEMETRY_DISABLED: "1"
  DATABASE_URL: file:.ci/tenant.db
  CONTROL_DATABASE_URL: file:.ci/control.db
  BETTER_AUTH_URL: http://localhost:3000
  AUTH_SECRET: ci-only-not-a-secret

jobs:
  lint:
    name: Lint (Biome)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: Tests (TZ=${{ matrix.tz }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        tz: [Europe/Berlin, UTC]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
      - name: Coverage summary
        if: matrix.tz == 'Europe/Berlin'
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
            console.log(["### Coverage", "| | % | covered |", "|---|---|---|",
              ...["lines","statements","functions","branches"].map(row)].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: matrix.tz == 'Europe/Berlin'
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  build:
    name: Build (local file DBs)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Guard - no remote database in CI
        run: |
          case "$DATABASE_URL $CONTROL_DATABASE_URL" in
            *libsql://*|*https://*) echo "Remote DB URL in CI" && exit 1;;
          esac
      - name: Migrate local databases
        run: |
          mkdir -p .ci
          pnpm exec drizzle-kit migrate
          pnpm exec drizzle-kit migrate --config=drizzle.control.config.ts
      - run: pnpm build
