name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI never gets production credentials: every database is a local libSQL
# file, created and migrated inside the job.
env:
  NEXT_TELEMETRY_DISABLED: "1"
  DATABASE_URL: file:.ci/tenant.db
  CONTROL_DATABASE_URL: file:.ci/control.db
  BETTER_AUTH_URL: http://localhost:3000
  AUTH_SECRET: ci-only-not-a-secret

jobs:
  lint:
    name: Lint (Biome)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .
      - name: No unexplained biome-ignore
        run: |
          if grep -rnE 'biome-ignore[^:]*:[^:]*$' src scripts test e2e | grep -vE 'biome-ignore[^:]*: .*[a-zA-Z]{3,}'; then
            echo '::error::Every biome-ignore needs a reason after the colon.'; exit 1
          fi

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: Tests (TZ=${{ matrix.tz }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        tz: [Europe/Berlin, UTC]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
      - name: Coverage may only go up (per area)
        run: pnpm coverage:check
      - name: Coverage summary
        if: matrix.tz == 'Europe/Berlin'
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
            console.log(["### Coverage", "| | % | covered |", "|---|---|---|",
              ...["lines","statements","functions","branches"].map(row)].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: matrix.tz == 'Europe/Berlin'
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  migrations:
    name: Migrations (consistency, immutability, drift)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Journal consistency + drizzle-kit check
        run: pnpm db:check
      - name: Applied migrations unchanged, new ones appended
        if: github.event_name == 'pull_request'
        env:
          MIGRATION_CONTRACT_OK: ${{ contains(github.event.pull_request.labels.*.name, 'migration:contract') && '1' || '' }}
        run: pnpm exec tsx scripts/ci/check-migrations.ts --base "origin/${{ github.base_ref }}"
      - name: Schema matches the committed migrations (no ungenerated changes)
        run: |
          timeout 120 pnpm exec drizzle-kit generate
          timeout 120 pnpm exec drizzle-kit generate --config=drizzle.control.config.ts
          if [ -n "$(git status --porcelain -- drizzle)" ]; then
            git status --porcelain -- drizzle
            echo "::error::Schema changes without a migration. Run pnpm db:generate / db:control:generate and commit the result."
            exit 1
          fi

  build:
    name: Build (local file DBs)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Guard - no remote database in CI
        run: |
          case "$DATABASE_URL $CONTROL_DATABASE_URL" in
            *libsql://*|*https://*) echo "Remote DB URL in CI" && exit 1;;
          esac
      - name: Migrate local databases
        run: |
          mkdir -p .ci
          pnpm exec drizzle-kit migrate
          pnpm exec drizzle-kit migrate --config=drizzle.control.config.ts
      - run: pnpm build

  e2e:
    name: E2E (Playwright, local DBs)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      # Builds the app, seeds .data/e2e with two tenants and runs the suite.
      # scripts/dev/run.ts pins every database to local files.
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  visual:
    name: Visual regression (Playwright image)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Same image as scripts/dev/visual.sh, so screenshots render with the
    # fonts the baselines in e2e/__screenshots__ were made with. Keep the tag
    # in sync with @playwright/test in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright test --project=visual
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: visual-diffs
          path: test-results/
          retention-days: 14
