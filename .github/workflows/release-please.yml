name: release-please

# Keeps a release PR open that bumps package.json and CHANGELOG.md from the
# conventional commits on main. Merging it tags vX.Y.Z — every production
# deploy can then be traced to a version (and its migration heads).
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          # Version and options live in the manifest. Below 1.0, breaking
          # changes bump the minor version instead of jumping to 1.0.0.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
